services:
  web:
    environment:
      SESSION_SECRET: "test-session-secret-32chars!xxxY"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      CLICKHOUSE_PASSWORD: "test-clickhouse-password-2026"
      BASE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      # OAuth via Dex OIDC provider
      OAUTH_ENABLED: "true"
      OAUTH_PROVIDER_NAME: "Dex"
      OAUTH_CLIENT_ID: ingressi-test-client
      OAUTH_CLIENT_SECRET: ingressi-test-secret
      OAUTH_ISSUER: http://localhost:5556/dex
      OAUTH_AUTHORIZATION_URL: http://localhost:5556/dex/auth
      OAUTH_TOKEN_URL: http://dex:5556/dex/token
      OAUTH_USERINFO_URL: http://dex:5556/dex/userinfo
      OAUTH_ALLOW_AUTO_LINKING: "true"
      # Allow OAuth sign-in to create new accounts — the OAuth e2e tests
      # (forward-auth-oauth, oauth-role-injection) exercise federated signup.
      # Closed by default in production (see config.auth.allowOauthRegistration).
      AUTH_ALLOW_OAUTH_REGISTRATION: "true"
      # Disable Better Auth rate limiting for E2E tests (many rapid auth requests)
      AUTH_RATE_LIMIT_ENABLED: "false"

  web-registration-enabled:
    container_name: ingressi-web-registration-enabled
    image: ghcr.io/ingres-si/ingressi-web:latest
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-registration-session-secret-32chars!xxxY"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      BASE_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_PATH: /app/data/ingressi.db
      DATABASE_URL: file:/app/data/ingressi.db
      CADDY_API_URL: http://caddy:2019
      CADDY_ADMIN_SOCKET: /run/caddy-admin/admin.sock
      # Shares the main E2E Caddy with the primary web instance; only one
      # monitor may auto-heal a shared Caddy or the two instances fight over
      # the configuration (this instance has its own empty database).
      CADDY_MONITOR_ENABLED: "false"
      AUTH_ALLOW_SELF_REGISTRATION: "true"
      AUTH_RATE_LIMIT_ENABLED: "false"
      OAUTH_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
    group_add:
      - "10000"
    volumes:
      - caddy-manager-registration-data:/app/data
      - caddy-admin:/run/caddy-admin
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: "test-clickhouse-password-2026"
    # Expose the HTTP interface so retention/TTL e2e tests can query directly.
    ports:
      - "8123:8123"
  caddy:
    # Alias so the Step-CA container can resolve the ACME test domain to Caddy
    # for HTTP-01 / TLS-ALPN-01 challenge validation (functional/acme-custom-ca.spec.ts).
    networks:
      caddy-network:
        aliases:
          - acme-e2e.test
    ports:
      - "80:80"
      - "443:443"
      # L4 test ports (TCP)
      - "15432:15432"
      - "15433:15433"
      - "15434:15434"
      # L4 test ports (UDP)
      - "15353:15353/udp"
  # Skip any local docker-compose.override.yml and use this file instead,
  # so the sidecar recreates caddy with the correct "-test" volume names.
  l4-port-manager:
    environment:
      COMPOSE_SKIP_OVERRIDE: "1"
      COMPOSE_EXTRA_FILE: /compose/tests/docker-compose.test.yml
  # Dex OIDC provider for OAuth E2E tests
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yml"]
    volumes:
      - ./tests/dex/config.yml:/etc/dex/config.yml:ro
    ports:
      - "5556:5556"
    networks:
      - caddy-network
  # OpenLDAP directory for the LDAP sign-in E2E test (tests/e2e/ldap-sign-in.spec.ts).
  # Seeded from tests/openldap/bootstrap.ldif: users e2e-admin, e2e-user and
  # e2e-outsider under ou=people,dc=example,dc=com, groups ingressi-users and
  # ingressi-admins under ou=groups. The web container reaches it as
  # openldap:389 (StartTLS) on caddy-network.
  #
  # The image's bundled CA expired in January 2026, so openldap-certs makes a
  # short-lived CA and server certificate for openldap on every fresh stack.
  openldap-certs:
    image: osixia/openldap:1.5.0
    entrypoint: ["sh", "-ec"]
    command:
      - |
        cd /certs
        if [ -f ldap.crt ] && openssl x509 -in ldap.crt -noout -checkend 86400; then exit 0; fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=Ingressi E2E LDAP CA" -keyout ca.key -out ca.crt
        openssl req -newkey rsa:2048 -nodes -subj "/CN=openldap" -keyout ldap.key -out ldap.csr
        printf 'subjectAltName=DNS:openldap\nextendedKeyUsage=serverAuth\n' > server.ext
        openssl x509 -req -in ldap.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 -extfile server.ext -out ldap.crt
        rm -f ldap.csr server.ext ca.srl
        chmod 644 ca.crt ldap.crt ldap.key
    volumes:
      - openldap-certs:/certs
  openldap:
    image: osixia/openldap:1.5.0
    hostname: openldap
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Example"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "ldap-admin-password-2026"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
    volumes:
      - ./tests/openldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
      - openldap-certs:/container/service/slapd/assets/certs
    depends_on:
      openldap-certs:
        condition: service_completed_successfully
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "ou=people,dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "ldap-admin-password-2026", "(uid=e2e-admin)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  # Keycloak SAML 2.0 identity provider for the SAML sign-in E2E test
  # (tests/e2e/saml-sign-in.spec.ts). Realm "ingressi-e2e" is imported from
  # tests/keycloak/realm.json: users e2e-saml-admin (groups ingressi-admins and
  # ingressi-users), e2e-saml-user (ingressi-users) and e2e-saml-outsider. The
  # spec registers the SAML client through Keycloak's admin API once it knows
  # the provider's SP entity ID. Browsers and the test runner reach it at
  # localhost:8089; the web container never contacts it (IdP metadata is read
  # once, when the provider is stored). No healthcheck: the spec waits for the
  # realm itself, so a slow start does not hold up the rest of the stack.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://localhost:8089"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "keycloak-admin-password-2026"
    volumes:
      - ./tests/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8089:8080"
    networks:
      - caddy-network
  # Hostile mock OIDC provider for the OAuth role-injection (H3) test.
  # Dex cannot emit custom claims, so this mock injects a `role: admin` claim
  # into every issued token to verify the app never lets an IdP set privileged
  # fields. Browser reaches it at localhost:5557; the web container reaches it at
  # mock-oidc:8080 (which is also the token `iss`, matching the provider issuer).
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      JSON_CONFIG_PATH: /config.json
    volumes:
      - ./tests/mock-oidc/config.json:/config.json:ro
    ports:
      - "5557:8080"
    networks:
      - caddy-network
  # Lightweight echo server reachable by Caddy as "echo-server:8080".
  # Returns a fixed body so tests can assert the proxy routed the request.
  echo-server:
    image: hashicorp/http-echo
    command: ["-text=echo-ok", "-listen=:8080"]
    networks:
      - caddy-network
  # Second echo server for load-balancing tests.
  # Returns a different body so tests can distinguish which upstream served the request.
  echo-server-2:
    image: hashicorp/http-echo
    command: ["-text=echo-server-2", "-listen=:8080"]
    networks:
      - caddy-network
  # Request-echo server: reflects the full HTTP request (method + path + headers) in the response body.
  # Used by path-prefix-rewrite tests to assert that Caddy rewrote the path before forwarding.
  whoami-server:
    image: traefik/whoami
    networks:
      - caddy-network
  # Mock Authelia-style forward-auth server reachable by Caddy as
  # "mock-forward-auth:9091". Backs the generic forward-auth functional tests
  # (tests/e2e/functional/forward-auth-generic.spec.ts).
  mock-forward-auth:
    image: node:20-alpine
    command: ["node", "/server.js"]
    volumes:
      - ./tests/mock-forward-auth/server.js:/server.js:ro
    networks:
      - caddy-network
  # REAL Authelia instance backing tests/e2e/functional/forward-auth-real-*.spec.ts.
  # Caddy reaches it as "authelia:9091" (the forward-auth provider upstream);
  # the test runner logs in at localhost:9092 with a "Host: auth.test" header
  # (matching the portal cookie-domain entry) and replays the issued session
  # cookie against the protected hosts.
  authelia:
    image: authelia/authelia:4.38
    command: ["--config", "/config/configuration.yml"]
    volumes:
      - ./tests/authelia/configuration.yml:/config/configuration.yml:ro
      - ./tests/authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-data:/data
    ports:
      - "9092:9091"
    networks:
      caddy-network:
        aliases:
          - auth.test
  # REAL Moonraker instance (upstream for the Moonraker scenario): validates
  # its own X-Api-Key for non-trusted clients, so the bypass-header path is
  # verified end-to-end against the real thing.
  moonraker:
    image: mkuf/moonraker:latest
    container_name: moonraker-e2e
    command: ["-c", "/opt/printer_data/config/moonraker.conf", "-d", "/opt/printer_data"]
    volumes:
      - ./tests/moonraker/moonraker.conf:/opt/printer_data/config/moonraker.conf:ro
    networks:
      - caddy-network
  # TCP echo server for L4 proxy tests.
  # Listens on port 9000 and echoes back anything sent to it with a prefix.
  tcp-echo:
    image: cjimti/go-echo
    platform: linux/amd64
    environment:
      TCP_PORT: "9000"
      NODE_NAME: "tcp-echo-ok"
    networks:
      - caddy-network
  # UDP echo server for L4 proxy tests.
  # Simple socat-based UDP echo: reflects any datagram back to sender.
  udp-echo:
    image: alpine/socat
    command: ["UDP4-RECVFROM:9001,fork", "EXEC:cat"]
    networks:
      - caddy-network

  # Internal ACME CA (Step-CA) for the custom-ACME functional test (issue #192).
  # Auto-initializes a root CA + ACME provisioner named "acme" on first boot,
  # serving its directory at https://step-ca:9000/acme/acme/directory.
  # Caddy reaches the test domain via the "acme-e2e.test" alias on the caddy
  # service for HTTP-01 / TLS-ALPN-01 challenge validation.
  step-ca:
    container_name: ingressi-step-ca
    image: smallstep/step-ca:0.27.4
    environment:
      DOCKER_STEPCA_INIT_NAME: "Ingressi E2E Step-CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
      DOCKER_STEPCA_INIT_ACME: "true"
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "false"
      DOCKER_STEPCA_INIT_PASSWORD: "e2e-step-ca-password"
    volumes:
      - step-ca-data:/home/step
    networks:
      - caddy-network
      # The high-availability storage test issues through Step-CA from caddy-master.
      - ha-acme-network

  # ── Master/slave pair for the settings-sync functional test (issue #192) ──
  # Each instance has its own isolated Caddy admin API. This lets settings updates
  # exercise the production apply/rollback path without replacing the main E2E
  # Caddy configuration or racing the rest of the browser suite.
  caddy-master:
    container_name: ingressi-caddy-master
    image: ghcr.io/ingres-si/ingressi-caddy:latest
    environment:
      PRIMARY_DOMAIN: master.ingressi.test
    volumes:
      - acme-ca-master:/acme-ca:ro
    networks:
      master-caddy-network:
        aliases:
          - caddy
      ha-storage-network:
      ha-acme-network:
        aliases:
          - ha-storage-e2e.test
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy-slave:
    container_name: ingressi-caddy-slave
    image: ghcr.io/ingres-si/ingressi-caddy:latest
    environment:
      PRIMARY_DOMAIN: slave.ingressi.test
    volumes:
      - acme-ca-slave:/acme-ca:ro
    networks:
      slave-caddy-network:
        aliases:
          - caddy
      # Valkey only: the slave cannot reach Step-CA (see ha-acme-network).
      ha-storage-network:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Shared certificate storage for the high-availability test
  # (tests/e2e/high-availability-storage.spec.ts): caddy-master and
  # caddy-slave reach it as valkey:6379. No volume: the data lives as long as
  # the container.
  valkey:
    container_name: ingressi-valkey
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--requirepass", "e2e-valkey-password-2026", "--appendonly", "yes"]
    networks:
      - ha-storage-network
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "e2e-valkey-password-2026", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web-master:
    container_name: ingressi-web-master
    image: ghcr.io/ingres-si/ingressi-web:latest
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-master-session-secret-32chars!xxY"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      BASE_URL: http://localhost:3002
      NEXTAUTH_URL: http://localhost:3002
      DATABASE_PATH: /app/data/ingressi.db
      DATABASE_URL: file:/app/data/ingressi.db
      CADDY_API_URL: http://caddy:2019
      OAUTH_ENABLED: "false"
      AUTH_RATE_LIMIT_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
      INSTANCE_MODE: master
      INSTANCE_SYNC_TOKEN: "e2e-sync-token-0123456789abcdef0123456789"
      INSTANCE_SYNC_ALLOW_HTTP: "true"
      INSTANCE_SYNC_INTERVAL: "0"
      INSTANCE_SLAVES: '[{"name":"slave","url":"http://web-slave:3000","token":"e2e-sync-token-0123456789abcdef0123456789"}]'
    volumes:
      - web-master-data:/app/data
      - acme-ca-master:/acme-ca
    depends_on:
      caddy-master:
        condition: service_healthy
    networks:
      instance-sync-network:
      master-caddy-network:
        aliases:
          - web
      # Test connection for the shared certificate storage runs from here.
      ha-storage-network:
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-slave:
    container_name: ingressi-web-slave
    image: ghcr.io/ingres-si/ingressi-web:latest
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-slave-session-secret-32chars!xxY"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      BASE_URL: http://localhost:3003
      NEXTAUTH_URL: http://localhost:3003
      DATABASE_PATH: /app/data/ingressi.db
      DATABASE_URL: file:/app/data/ingressi.db
      CADDY_API_URL: http://caddy:2019
      OAUTH_ENABLED: "false"
      AUTH_RATE_LIMIT_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
      INSTANCE_MODE: slave
      INSTANCE_SYNC_TOKEN: "e2e-sync-token-0123456789abcdef0123456789"
      INSTANCE_SYNC_ALLOW_HTTP: "true"
    volumes:
      - web-slave-data:/app/data
      - acme-ca-slave:/acme-ca
    depends_on:
      caddy-slave:
        condition: service_healthy
    networks:
      instance-sync-network:
      slave-caddy-network:
        aliases:
          - web
      ha-storage-network:
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  # The two web instances communicate with each other here. Keep this bridge
  # non-internal so Docker can publish their E2E ports to the host.
  instance-sync-network:
    driver: bridge
  # Each Caddy admin API is reachable only by its corresponding web instance.
  master-caddy-network:
    driver: bridge
    internal: true
  slave-caddy-network:
    driver: bridge
    internal: true
  # Shared certificate storage: both Caddys, both web containers (for the
  # connection test) and Valkey.
  ha-storage-network:
    driver: bridge
    internal: true
  # caddy-master and Step-CA only. The slave cannot reach the CA, so a
  # certificate it serves can only have come from the shared storage.
  ha-acme-network:
    driver: bridge
    internal: true

volumes:
  caddy-manager-data:
    name: caddy-manager-data-test
  caddy-manager-registration-data:
    name: caddy-manager-registration-data-test
  caddy-data:
    name: caddy-data-test
  caddy-config:
    name: caddy-config-test
  caddy-logs:
    name: caddy-logs-test
  geoip-data:
    name: geoip-data-test
  clickhouse-data:
    name: clickhouse-data-test
  acme-ca:
    name: acme-ca-test
  acme-ca-master:
    name: acme-ca-master-test
  acme-ca-slave:
    name: acme-ca-slave-test
  step-ca-data:
    name: step-ca-data-test
  web-master-data:
    name: web-master-data-test
  web-slave-data:
    name: web-slave-data-test
  authelia-data:
    name: authelia-data-test
  openldap-certs:
    name: openldap-certs-test
