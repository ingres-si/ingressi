name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    # Zero out GITHUB_TOKEN permissions — tests have no external dependencies and
    # need no credentials. No secrets: references in this workflow either, so no
    # repo secrets are injected into the environment.
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check clean dependency graph
        run: bun run typecheck

      - name: Run unit and integration tests
        run: bun run test

      - name: Build production application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_PATH: /tmp/ingressi-build.db
          DATABASE_URL: file:/tmp/ingressi-build.db
          SESSION_SECRET: ci-build-session-secret-at-least-32-chars
          ADMIN_PASSWORD: ci-build-admin-password
        # --bun runs Next.js under Bun, as the web image does (it has no
        # Node): under Node, next.config.mjs falls back to better-sqlite3,
        # which the middleware bundle cannot load.
        run: bun --bun run build

  caddy-modules:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: docker/caddy/go.mod
          cache-dependency-path: docker/caddy/go.sum

      # Decodes every DNS provider's credential keys into the bundled Caddy
      # module, so a module update that renames a field fails here instead
      # of at config load.
      - name: Check DNS provider fields against the Caddy modules
        working-directory: docker/caddy
        run: go test ./...
