services:
  web:
    container_name: ingressi-web
    image: ghcr.io/ingres-si/ingressi-web:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # User and group IDs for rootless operation
        # Set these to match your host user to avoid permission issues
        # Find your UID/GID with: id -u / id -g
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Node environment
      NODE_ENV: production

      # REQUIRED: Session secret for encrypting cookies and sessions
      # Generate with: openssl rand -base64 32
      # SECURITY: You MUST set this to a unique value in production!
      SESSION_SECRET: ${SESSION_SECRET:?ERROR - SESSION_SECRET is required}
      # Earlier SESSION_SECRET values (comma-separated), only used to decrypt
      # stored secrets after a rotation (see .env.example)
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}

      # Caddy API endpoint (internal communication). The hostname identifies the
      # Caddy service; the admin API itself is reached over CADDY_ADMIN_SOCKET.
      CADDY_API_URL: ${CADDY_API_URL:-http://caddy:2019}
      # Unix socket for the Caddy admin API (shared volume with the caddy
      # service). Leave empty to reach the admin API over CADDY_API_URL's TCP port.
      CADDY_ADMIN_SOCKET: ${CADDY_ADMIN_SOCKET-/run/caddy-admin/admin.sock}

      # Public base URL for the application
      BASE_URL: ${BASE_URL:-http://localhost:3000}

      # Database configuration
      DATABASE_PATH: /app/data/ingressi.db
      DATABASE_URL: file:/app/data/ingressi.db

      # NextAuth configuration
      NEXTAUTH_URL: ${BASE_URL:-http://localhost:3000}

      # Extra external ports for forward-auth protected sites (see .env.example)
      FORWARD_AUTH_ALLOWED_PORTS: ${FORWARD_AUTH_ALLOWED_PORTS:-}

      # Header carrying the real client IP for per-IP login rate limits, e.g.
      # behind a CDN; leave unset when Caddy is the outermost proxy and set it
      # only behind a proxy that always overwrites it (see .env.example)
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}

      # REQUIRED: Admin credentials for login
      # SECURITY: You MUST set these to secure values in production!
      # Password must be 12+ chars with uppercase, lowercase, numbers, and special chars
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ERROR - ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ERROR - ADMIN_PASSWORD is required}

      # Self-registration is disabled unless explicitly enabled
      AUTH_ALLOW_SELF_REGISTRATION: ${AUTH_ALLOW_SELF_REGISTRATION:-false}
      AUTH_ALLOW_OAUTH_REGISTRATION: ${AUTH_ALLOW_OAUTH_REGISTRATION:-false}
      AUTH_ALLOW_OAUTH_ROLE_FROM_CLAIMS: ${AUTH_ALLOW_OAUTH_ROLE_FROM_CLAIMS:-false}

      # Rate limits (see .env.example). Defaults are spelled out because an
      # empty value is read as 0, not as the default.
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MS: ${LOGIN_WINDOW_MS:-300000}
      LOGIN_BLOCK_MS: ${LOGIN_BLOCK_MS:-900000}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}

      # Certificate checks and storage (empty means the built-in default)
      CADDY_TLS_ADDRESS: ${CADDY_TLS_ADDRESS:-}
      CERTS_DIRECTORY: ${CERTS_DIRECTORY:-}

      # OAuth2/OIDC Authentication (Optional - works with Authentik, Authelia, Keycloak, etc.)
      OAUTH_ENABLED: ${OAUTH_ENABLED:-false}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-OAuth2}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_AUTHORIZATION_URL: ${OAUTH_AUTHORIZATION_URL:-}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:-}
      OAUTH_ALLOW_AUTO_LINKING: ${OAUTH_ALLOW_AUTO_LINKING:-false}

      # Instance sync (master): time limit in ms for one sync request to a slave
      INSTANCE_SYNC_TIMEOUT_MS: ${INSTANCE_SYNC_TIMEOUT_MS:-60000}

      # Pull replica: values shown by Fleet -> Pull replicas on the master
      INSTANCE_SYNC_MODE: ${INSTANCE_SYNC_MODE:-}
      INSTANCE_MASTER_URL: ${INSTANCE_MASTER_URL:-}
      INSTANCE_PULL_TOKEN: ${INSTANCE_PULL_TOKEN:-}
      INSTANCE_PULL_INTERVAL: ${INSTANCE_PULL_INTERVAL:-}

      # ClickHouse analytics database (optional: leave CLICKHOUSE_PASSWORD empty to turn analytics off)
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ingressi}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      # Days of analytics data to keep before TTL deletes it (default 30)
      CLICKHOUSE_RETENTION_DAYS: ${CLICKHOUSE_RETENTION_DAYS:-30}
    group_add:
      # caddy's GID: group access to the log files (read access.log,
      # truncate the group-writable waf-audit.log). The web user never needs
      # to list /logs itself; see the caddy-logs note on the caddy service.
      - "${CADDY_GID:-10000}"
    volumes:
      - caddy-manager-data:/app/data
      - geoip-data:/usr/share/GeoIP:ro,z
      # Read-write: waf-log-parser truncates waf-audit.log after ingesting it,
      # since Coraza's SecAuditLog has no built-in rotation of its own.
      - caddy-logs:/logs
      # Custom ACME CA root PEM written here by web, read by caddy (issue #192)
      - acme-ca:/acme-ca
      # Caddy admin API unix socket (created by caddy; reached via the shared
      # caddy GID group_add above). web only connects to the socket; the dir is
      # caddy-owned so web cannot create files here.
      - caddy-admin:/run/caddy-admin
    depends_on:
      caddy:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    container_name: ingressi-caddy
    image: ghcr.io/ingres-si/ingressi-caddy:latest
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        # User and group IDs for rootless operation
        # Set these to match your host user to avoid permission issues
        # Find your UID/GID with: id -u / id -g
        PUID: ${PUID:-10000}
        PGID: ${PGID:-10000}
    restart: unless-stopped
    ports:
      - "80:80"
      - "80:80/udp"
      - "443:443"
      - "443:443/udp"
      # - "2019:2019"     # Admin API
      # Admin API (port 2019) is only exposed on internal network for security, enable at your risk
      # Web UI accesses via http://caddy:2019 internally
      # Uncomment the line below to expose metrics externally for Grafana/Prometheus
      # - "9090:9090"  # Metrics available at http://localhost:9090/metrics (configure in Settings first)
    environment:
      # Primary domain for Caddy configuration
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-ingressi.localhost}
      # Admin API over a unix socket (no TCP admin port for in-container proxied
      # traffic to dial). The web service sets the same listener with every
      # apply (CADDY_ADMIN_SOCKET), so the two must agree. To use the TCP port
      # instead, set this to 0.0.0.0:2019 and CADDY_ADMIN_SOCKET to empty.
      CADDY_ADMIN_LISTEN: ${CADDY_ADMIN_LISTEN:-unix//run/caddy-admin/admin.sock|0660}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Admin API unix socket, shared with the web container (CADDY_ADMIN_SOCKET).
      - caddy-admin:/run/caddy-admin
      # If you override this named volume with a bind mount, the host dir
      # MUST be readable and writable by caddy's UID/GID: Caddy's log roller
      # (timberjack) lists the directory to gzip and prune old rolled files.
      # A write-only dir (e.g. mode 0733/0773) keeps rotation working but
      # silently disables cleanup and fills the disk. On the host run:
      #   chgrp <CADDY_GID> <host-dir> && chmod 2770 <host-dir>
      - caddy-logs:/logs
      - geoip-data:/usr/share/GeoIP:ro,z
      # Custom ACME CA root PEM written by web, read here for trusted_roots_pem_files (issue #192)
      - acme-ca:/acme-ca:ro
    networks:
      - caddy-network
    healthcheck:
      # Caddy listens on the admin socket (a socket file left behind by an
      # earlier container is not listed in /proc/net/unix), or answers on the
      # TCP port while it still runs a configuration saved before the socket
      # was set up (the web service moves it to the socket with its first apply).
      test: ["CMD-SHELL", "grep -q /run/caddy-admin/admin.sock /proc/net/unix || wget --quiet --tries=1 -O /dev/null http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Docker socket proxy: limits the Docker API that l4-port-manager can reach.
  # Allows container management and network inspection (needed by docker compose up
  # to inspect caddy-network when recreating the caddy container for L4 port changes).
  docker-socket-proxy:
    container_name: ingressi-docker-proxy
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      SECRETS: 0
      # Deny everything else by default
      EXEC: 0
      SWARM: 0
      AUTH: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # SELinux hosts (Fedora, RHEL, CoreOS) refuse a confined container the
    # Docker socket, so every call through the proxy would fail with 503 and
    # L4 port changes would never apply. Labelling stays on for every other
    # container; this one is already root-equivalent through the socket, and
    # the option does nothing on hosts without SELinux.
    security_opt:
      - label=disable
    # Security: keep the socket proxy off the shared app network. Only the
    # l4-port-manager sidecar needs to reach its container-create API; exposing
    # it to web/caddy/clickhouse would turn any container compromise into host
    # root (POST + CONTAINERS = create a privileged container that mounts the
    # host fs). This network is `internal: true` (no egress) and carries only
    # the proxy + sidecar.
    networks:
      - socket-proxy

  # L4 port manager sidecar: recreates the caddy container
  # when L4 proxy host ports change.
  # Uses Docker socket proxy instead of direct Docker socket access.
  l4-port-manager:
    container_name: ingressi-l4-ports
    image: ghcr.io/ingres-si/ingressi-l4-port-manager:latest
    build:
      context: .
      dockerfile: docker/l4-port-manager/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COMPOSE_DIR: /compose
      POLL_INTERVAL: "${L4_PORT_MANAGER_POLL_INTERVAL:-2}"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - caddy-manager-data:/data
      - .:/compose:ro
    depends_on:
      caddy:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    # Reaches Docker only via the socket proxy (over the isolated socket-proxy
    # network) and recreates caddy through the mounted compose dir, so it does
    # not need the shared app network.
    networks:
      - socket-proxy

  clickhouse:
    container_name: ingressi-clickhouse
    image: clickhouse/clickhouse-server:latest-alpine
    profiles: [clickhouse]
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ingressi}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Mount only our single override file, not the whole config.d directory.
      # Bind-mounting the directory would shadow the image's docker_related_config.xml
      # (which sets listen_host to ::/0.0.0.0), leaving ClickHouse bound to loopback
      # only so the web container could no longer reach it.
      - ./docker/clickhouse/config.d/low-disk-write.xml:/etc/clickhouse-server/config.d/low-disk-write.xml:ro
    # Compose interpolates every service, active profile or not, so the
    # password check lives here and only fires when ClickHouse really starts.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$CLICKHOUSE_PASSWORD" ] || { echo "set CLICKHOUSE_PASSWORD in .env, or remove clickhouse from COMPOSE_PROFILES" >&2; exit 1; }; exec /entrypoint.sh "$$@"'
      - clickhouse
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  geoipupdate:
    container_name: ingressi-geoipupdate
    image: ghcr.io/maxmind/geoipupdate
    profiles: [geoipupdate]
    restart: always
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:-}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:-}
      - 'GEOIPUPDATE_EDITION_IDS=GeoLite2-ASN GeoLite2-City GeoLite2-Country'
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip-data:/usr/share/GeoIP:z
    networks:
      - caddy-network

networks:
  caddy-network:
    driver: bridge
  # Isolated network for the Docker socket proxy and the l4-port-manager sidecar
  # only. `internal: true` prevents external connectivity; no other service is
  # attached, so a compromise of web/caddy/etc. cannot reach the socket proxy.
  socket-proxy:
    driver: bridge
    internal: true

# The volume names predate the rename to Ingressi and stay as they are:
# renamed volumes would start empty on existing installs.
volumes:
  caddy-manager-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  geoip-data:
  clickhouse-data:
  acme-ca:
  # Holds the Caddy admin API unix socket, shared between caddy and web.
  caddy-admin:
